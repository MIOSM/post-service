version: '3.8'
services:
  mysql-post:
    image: mysql:8.0
    container_name: mysql-post-service
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: post_service
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_post_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  minio:
    image: minio/minio:latest
    container_name: minio-post
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9003
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:4200,http://localhost:8085"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - post-network

volumes:
  mysql_post_data:
  minio_data:

networks:
  post-network: